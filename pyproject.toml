[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holdfast"
version = "0.2.1"
description = "Linux daemon that gates agent file, shell, and network operations"
requires-python = ">=3.11"
authors = [{ name = "Holdfast" }]
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6.0",
    "websockets>=12.0",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
edge = ["httpx>=0.27"]

[project.scripts]
holdfastd = "holdfast.server:main"
holdfast = "holdfast.cli:main"
holdfast-edge = "holdfast_edge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["holdfast*", "holdfast_edge*"]
exclude = ["holdfast.tests*", "holdfast_edge.tests*"]

[tool.setuptools.package-data]
holdfast = ["_pythonpath/sitecustomize.py"]

[tool.pytest.ini_options]
testpaths = ["src/holdfast/tests", "src/holdfast_edge/tests"]
pythonpath = ["src"]
addopts = "-q"
